<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Movie Recommender{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Critical CSS to prevent FOUC (Flash of Unstyled Content) -->
    <style>
        /* Prevent layout shift and unstyled flash */
        html {
            scroll-behavior: smooth;
        }
        
        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #0b1220;
            color: #e2e8f0;
        }

        [v-cloak] {
            visibility: hidden;
        }

        /* Apply theme immediately before page renders */
        .app-body {
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .app-body.ui-dark {
            --bg-page: #0b1220;
            --bg-elevated: #111a2e;
            --bg-muted: #0f172a;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-soft: #253248;
            --chip-bg: #16233b;
            --chip-text: #cbd5e1;
            --chip-border: #334155;
            --chip-active-bg: #38bdf8;
            --chip-active-text: #0b1220;
            --panel-bg: rgba(17, 26, 46, 0.9);
            --panel-border: #2a3a56;
            --panel-shadow: 0 18px 50px rgba(2, 6, 23, 0.45);
            --card-bg: #131d33;
            --card-border: #28364f;
            --card-shadow: 0 10px 24px rgba(2, 6, 23, 0.35);
            --hero-bg: linear-gradient(180deg, #0b1220 0%, #121b30 100%);
            --nav-bg: rgba(11, 18, 32, 0.88);
            --footer-bg: #0b1220;
            --empty-border: #334155;
            --empty-bg: linear-gradient(180deg, #111a2e 0%, #0f172a 100%);
        }

        .app-body.ui-light {
            --bg-page: #f5f5f5;
            --bg-elevated: #ffffff;
            --bg-muted: #f4f4f5;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-soft: #e2e8f0;
            --chip-bg: #ffffff;
            --chip-text: #334155;
            --chip-border: #dbe2ea;
            --chip-active-bg: #111827;
            --chip-active-text: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --panel-border: #eceef5;
            --panel-shadow: 0 18px 50px rgba(15, 23, 42, 0.06);
            --card-bg: #ffffff;
            --card-border: #eceef5;
            --card-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
            --hero-bg: linear-gradient(180deg, #f5f5f5 0%, #ffffff 100%);
            --nav-bg: rgba(255, 255, 255, 0.9);
            --footer-bg: transparent;
            --empty-border: #cbd5e1;
            --empty-bg: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        }

        .app-navbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--nav-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-soft);
        }

        /* Make green status/link text more noticeable in UI2 (light mode). */
        .app-body.ui-light .has-text-success,
        .app-body.ui-light .inline-status.success-inline,
        .app-body.ui-light .status-message.success,
        .app-body.ui-light .submit-status.success,
        .app-body.ui-light .already-submitted-note,
        .app-body.ui-light .movie-rated-time {
            color: #00a63e !important;
        }

        .app-body.ui-light .choice-card,
        .app-body.ui-light .chart-card {
            border: 1px solid #cfd6df;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7), 0 10px 26px rgba(15, 23, 42, 0.04);
        }

    </style>
</head>

<!-- Set body class immediately to avoid FOUC -->
<script>
    (function() {
        const activeUI = (document.cookie.match(/user_ui=([^;]+)/) || ['', '1'])[1];
        document.documentElement.setAttribute('data-ui', activeUI);
        // Cookies may not be parsed yet, so we'll rely on server-side rendering
    })();
</script>

{% set active_ui = request.cookies.get('user_ui', '1') %}
<body class="app-body {% if active_ui == '2' %}ui-light{% else %}ui-dark{% endif %} {% block body_class %}{% endblock %}" style="opacity: 1;">
<nav class="navbar app-navbar" role="navigation" aria-label="main navigation">
    <div class="container is-fluid app-navbar-container" style="padding: 0.8rem 1rem;">
        <div class="app-navbar-flex" style="display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 1rem;">
            <!-- Left: Brand and Links -->
            <div class="app-navbar-left" style="display: flex; align-items: center; gap: 1rem;">
                <div class="app-navbar-links" style="display: flex; align-items: center; gap: 0;">
                    <a class="navbar-item" href="/" style="padding: 0.45rem 0.7rem; border-radius: 10px; font-weight: 500; color: var(--text-primary);">Home</a>
                    <a class="navbar-item" href="/profile" style="padding: 0.45rem 0.7rem; border-radius: 10px; font-weight: 500; color: var(--text-primary);">Profile</a>
                    <a class="navbar-item" href="/feedback" style="padding: 0.45rem 0.7rem; border-radius: 10px; font-weight: 500; color: var(--text-primary);">Feedback</a>
                    <a class="navbar-item" href="/evaluation" style="padding: 0.45rem 0.7rem; border-radius: 10px; font-weight: 500; color: var(--text-primary);">Evaluation</a>
                </div>
            </div>

            <!-- Right: Auth Actions -->
            <div class="app-navbar-right" style="display: flex; align-items: center; gap: 0.8rem; flex-shrink: 0;">
                {% if g.user %}
                    <span class="navbar-username" style="color: var(--text-primary); font-weight: 500; font-size: 0.95rem; display: none;">{{ g.user.username }}</span>
                    <a class="button is-small" href="{{ url_for('auth.logout') }}" 
                       style="padding: 0.45rem 0.9rem; border-radius: 10px; background: var(--chip-bg); color: var(--text-primary); border: 1px solid var(--chip-border); font-weight: 500; transition: all 0.2s ease;"
                       onmouseover="this.style.transform='translateY(-1px)'; this.style.borderColor='var(--chip-active-bg)'"
                       onmouseout="this.style.transform='none'">Logout</a>
                {% else %}
                    <a class="button is-small" href="{{ url_for('auth.login') }}" 
                       style="padding: 0.45rem 0.9rem; border-radius: 10px; background: #2d5aa3; color: #ffffff; border: 1px solid #2d5aa3; font-weight: 500; transition: all 0.2s ease;"
                       onmouseover="this.style.transform='translateY(-1px)'; this.style.opacity='0.9'"
                       onmouseout="this.style.transform='none'; this.style.opacity='1'">Sign In</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<footer class="footer mt-6">
    <div class="container is-max-widescreen">
        <div class="content has-text-centered">
            <p>
                Copyright © 2026 <a href="https://hci.comp.hkbu.edu.hk" target="_blank"><strong>PI Lab</strong></a>. All Rights Reserved.
            </p>
            <a href="https://www.comp.hkbu.edu.hk" target="_blank"><img src="/static/img/comp-logo.png"
                                                                            alt="logo"
                                                                            style="height: 30px; margin-right: 20px"></a>
            <a href="https://hkbu.edu.hk" target="_blank"><img src="/static/img/bu-logo.png" alt="logo"
                                                                   style="height: 30px;"></a>
        </div>
    </div>
</footer>

{% if g.user %}
<script>
    (function () {
        try {
            const rawRatings = localStorage.getItem('rec_user_ratings');
            const rawGenres = localStorage.getItem('rec_genre_prefs');
            const algorithm = localStorage.getItem('rec_algorithm');
            const uiMode = localStorage.getItem('rec_ui_mode');
            const rawFeedbackProgress = localStorage.getItem('feedback_participant_submitted_types');
            const rawFeedbackRecordIds = localStorage.getItem('feedback_participant_record_ids');
            const rawSetupSaved = localStorage.getItem('rec_setup_saved');

            const hasRatings = !!rawRatings && rawRatings !== '{}';
            const hasGenres = !!rawGenres && rawGenres !== '{}';
            const hasPrefs = !!algorithm || !!uiMode;
            const hasFeedbackProgress = !!rawFeedbackProgress && rawFeedbackProgress !== '[]';
            const hasFeedbackRecords = !!rawFeedbackRecordIds && rawFeedbackRecordIds !== '[]';
            const hasSetupSaved = rawSetupSaved === '1' || rawSetupSaved === 'true';

            if (!hasRatings && !hasGenres && !hasPrefs && !hasFeedbackProgress && !hasFeedbackRecords && !hasSetupSaved) {
                return;
            }

            let ratingsObject = {};
            let genresObject = {};
            let feedbackProgressTypes = [];
            let feedbackRecordIds = [];
            try {
                ratingsObject = rawRatings ? JSON.parse(rawRatings) : {};
            } catch (_err) {
                ratingsObject = {};
            }
            try {
                genresObject = rawGenres ? JSON.parse(rawGenres) : {};
            } catch (_err) {
                genresObject = {};
            }
            try {
                const parsedProgress = rawFeedbackProgress ? JSON.parse(rawFeedbackProgress) : [];
                feedbackProgressTypes = Array.isArray(parsedProgress) ? parsedProgress : [];
            } catch (_err) {
                feedbackProgressTypes = [];
            }
            try {
                const parsedRecordIds = rawFeedbackRecordIds ? JSON.parse(rawFeedbackRecordIds) : [];
                feedbackRecordIds = Array.isArray(parsedRecordIds) ? parsedRecordIds : [];
            } catch (_err) {
                feedbackRecordIds = [];
            }

            const ratings = Object.keys(ratingsObject).map((movieId) => ({
                movieId: parseInt(movieId, 10),
                rating: ratingsObject[movieId]?.rating,
                timestamp: ratingsObject[movieId]?.timestamp
            })).filter((item) => !Number.isNaN(item.movieId) && item.rating != null);

            const genrePreferences = {};
            Object.keys(genresObject).forEach((genreId) => {
                const parsed = parseInt(genreId, 10);
                if (!Number.isNaN(parsed) && genresObject[genreId] && genresObject[genreId].score != null) {
                    genrePreferences[String(parsed)] = genresObject[genreId].score;
                }
            });

            const setupSaved = rawSetupSaved === '1' || rawSetupSaved === 'true';

            fetch('/api/migrate-ratings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ratings,
                    genrePreferences,
                    algorithm,
                    uiMode,
                    setupSaved,
                    feedbackProgressTypes,
                    feedbackRecordIds
                }),
                keepalive: true
            }).then((resp) => {
                if (!resp.ok) {
                    return;
                }
                // Guest local state has been moved to user account.
                localStorage.removeItem('rec_user_ratings');
                localStorage.removeItem('rec_genre_prefs');
                localStorage.removeItem('rec_algorithm');
                localStorage.removeItem('rec_ui_mode');
                localStorage.removeItem('rec_selected_genres');
                localStorage.removeItem('feedback_participant_submitted_types');
                localStorage.removeItem('feedback_participant_record_ids');
                localStorage.removeItem('rec_setup_saved');
                document.cookie = 'user_rates=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
                document.cookie = 'user_genre_scores=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
            }).catch(() => {
                // Ignore migration errors to avoid interrupting page use.
            });
        } catch (_err) {
            // Ignore migration errors to avoid interrupting page use.
        }
    })();
</script>
{% endif %}

<style>
    /* Layout and structure */
    .app-body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    main {
        flex: 1;
        padding: 1.5rem;
        max-width: 1240px;
        margin: 0 auto;
        width: 100%;
    }

    /* Typography styling */
    .app-body .title,
    .app-body .subtitle,
    .app-body .label,
    .app-body .content,
    .app-body p,
    .app-body li,
    .app-body span {
        color: var(--text-primary);
    }

    .app-body .has-text-grey,
    .app-body .has-text-grey-dark,
    .app-body .help {
        color: var(--text-secondary) !important;
    }

    /* Card and component styling */
    .app-body .box,
    .app-body .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        box-shadow: var(--card-shadow);
        color: var(--text-primary);
    }

    .app-body .box a,
    .app-body .card a {
        color: #2d5aa3;
    }

    .app-body .box a:hover,
    .app-body .card a:hover {
        color: #274a81;
    }

    /* Input styling */
    .app-body input,
    .app-body textarea,
    .app-body select {
        background: var(--bg-elevated);
        color: var(--text-primary);
        border: 1px solid var(--border-soft);
    }

    .app-body input:focus,
    .app-body textarea:focus,
    .app-body select:focus {
        border-color: #2d5aa3;
        box-shadow: 0 0 0 3px rgba(45, 90, 163, 0.1);
    }

    /* Button styling */
    .app-body .button {
        color: var(--text-primary);
        border-color: var(--border-soft);
        background: var(--bg-elevated);
        font-weight: 500;
        transition: all 0.12s ease;
    }

    .app-body .button:hover {
        transform: translateY(-1px);
        border-color: #2d5aa3;
        background: var(--panel-bg);
    }

    .app-body .button.is-primary {
        background: #2d5aa3;
        color: #ffffff;
        border-color: #2d5aa3;
    }

    .app-body .button.is-primary:hover {
        background: #274a81;
        border-color: #274a81;
    }

    /* Navbar specific */
    .app-navbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--nav-bg);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border-soft);
        margin-bottom: 1.5rem;
    }

    .navbar-item {
        padding: 0.45rem 0.7rem !important;
        border-radius: 10px;
        transition: all 0.2s ease;
    }

    .navbar-item:hover {
        background: color-mix(in srgb, var(--text-primary) 10%, transparent);
    }

    .app-body.ui-dark .navbar-item:hover {
        background: transparent;
    }

    .navbar-username {
        display: none;
        max-width: 190px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    @media (min-width: 769px) {
        .navbar-username {
            display: inline-block !important;
        }
    }

    /* Footer styling */
    .footer {
        background: var(--footer-bg);
        border-top: 1px solid var(--border-soft);
        color: var(--text-secondary);
        margin-top: 3rem;
        padding: 2rem 1.5rem;
    }

    .footer a {
        color: #2d5aa3;
    }

    .footer a:hover {
        color: #274a81;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .app-navbar {
            margin-bottom: 1rem;
        }

        .app-navbar-container {
            padding: 0.6rem 0.5rem !important;
        }

        .app-navbar-flex {
            gap: 0.5rem !important;
        }

        .navbar-item {
            padding: 0.35rem 0.5rem !important;
        }

        .app-navbar-right {
            flex-wrap: nowrap;
            min-width: 0;
            gap: 0.25rem;
        }

        .app-navbar-links {
            display: none;
        }

        .navbar-username {
            display: none;
        }

        .app-navbar-right .button {
            flex-shrink: 0;
            padding: 0.25rem 0.45rem !important;
            font-size: 0.8rem;
        }
    }
</style>
</body>
</html>
